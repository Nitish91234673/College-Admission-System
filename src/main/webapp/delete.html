<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-color: cadetblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        input[type="text"],
        input[type="email"],
        select { 
            width:100%; 
            margin-bottom: 15px;     
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .container {
            background-color:beige;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 400px;
        }
        .container h2 {
            color: #4caf50;
            margin-bottom: 20px;
        }
        button[type="submit"] {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        a{
				         text-decoration: none;
				         color:#fff;
				         display:block;
				          width:fit-content;
				          margin:30px 0px;
				          font-size: 30px;
				       
				}
        </style>
    </head>
    <body>
        <center>
            <h1><u>Delete The Records of The Students</u></h1>
            <br>
       <div class="container">
        <form method="post" action="delete">
            <h2>fill the details of the students that you want to delete</h2>
              <br>
              <label>Applicant Id:</label>
              <input type="text" name="applicantid">
                    <label>Name:</label>
                     <input type="text" name="name">
                    <label>Email:</label>
                    <input type="email" name="email">
                    <label>Session:</label>
                     <select name="session">
                        <option value="-1">select</option>
                        <option value="2019-22">2019-22</option>
                        <option value="2020-23">2020-23</option>
                        <option value="2022-25">2022-25</option>
                      </select>
                      <br>
                      <br>
                      <button type="submit">Delete</button>
                      
        </form>
       </div>
       <a href="welcome.html">home</a>
       </center>
    </body>
</html>
